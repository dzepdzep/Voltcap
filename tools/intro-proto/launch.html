<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="960" height="540"></canvas>
<script>
// Prototype of the game launch animation ("Ignition"). Same math as LaunchAnimation.kt.
const T={total:860, riseEnd:260, traceFrom:110, hit:500, sweepTo:720, ringTo:780, zoomFrom:560, titleIn:140, titleInEnd:360, titleOut:600, titleOutEnd:740};
function ph(t,a,b){return Math.min(1,Math.max(0,(t-a)/(b-a)));}
function eOut3(x){return 1-Math.pow(1-x,3);}
function eIn2(x){return x*x;}
function eInOut3(x){return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;}
// point on a rounded rect (half sizes hw, hh, radius r) at distance d from bottom-centre, going towards -x first when dir=-1
function rrPoint(hw,hh,r,s,dir){
  const sx=hw-r, sy=hh-r, arc=Math.PI*r/2; const half=sx+arc+2*sy+arc+sx; let d=s*half;
  let x,y;
  if(d<sx){x=-d;y=hh;}
  else if((d-=sx)<arc){const a=Math.PI/2+d/r; x=-sx+r*Math.cos(a); y=sy+r*Math.sin(a);}
  else if((d-=arc)<2*sy){x=-hw;y=sy-d;}
  else if((d-=2*sy)<arc){const a=Math.PI+d/r; x=-sx+r*Math.cos(a); y=-sy+r*Math.sin(a);}
  else {d-=arc; x=-sx+d; y=-hh;}
  return [x*(-dir), y]; // dir=-1 → mirror so the spark goes left
}
let cover=null;
function makeCover(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,w,h);gr.addColorStop(0,'#1f6fd1');gr.addColorStop(0.5,'#7b2fd6');gr.addColorStop(1,'#f0592a');g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.fillStyle='rgba(255,255,255,0.9)';g.font=`900 ${w*0.16}px Arial`;g.textAlign='center';g.fillText('SUPER',w/2,h*0.2);g.fillText('GAME',w/2,h*0.34);
  g.beginPath();g.arc(w/2,h*0.65,w*0.25,0,6.28);g.fillStyle='rgba(255,220,120,0.85)';g.fill();return c;}
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
const ACC=[245,154,44];
function rgba(c,a){return `rgba(${c[0]},${c[1]},${c[2]},${a})`;}
function draw(ctx,t,W,H){
  const ch=H*0.5, cw=ch*2/3, cr=ch*0.045; const cx=W/2, cy=H*0.44;
  if(!cover) cover=makeCover(Math.round(cw),Math.round(ch));
  // the launcher behind
  ctx.fillStyle='#334'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#556'; for(let i=0;i<8;i++) ctx.fillRect(20+i*120,H*0.62,100,150);
  const rise=eOut3(ph(t,0,T.riseEnd)); const zoom=eIn2(ph(t,T.zoomFrom,T.total));
  // scrim: dark, then fully black at the end
  ctx.fillStyle=`rgba(4,3,6,${0.93*eOut3(ph(t,0,200)) + 0.07*zoom})`; ctx.fillRect(0,0,W,H);
  // hero backdrop (here: blurred cover) very dim, slowly settling
  ctx.save(); ctx.globalAlpha=0.16*rise*(1-zoom); const hs=1.12-0.06*rise+0.2*zoom; ctx.filter='blur(18px)';
  ctx.drawImage(cover, cx-W*hs/2, cy-W*hs*1.5/2, W*hs, W*hs*1.5); ctx.restore(); ctx.filter='none';
  // warm glow behind the cover
  const hitK = t>=T.hit ? Math.pow(1-ph(t,T.hit,T.hit+300),2):0;
  const charge=eInOut3(ph(t,T.traceFrom,T.hit));
  const ga=(0.07+0.08*charge+0.16*hitK)*(1-zoom); let g=ctx.createRadialGradient(cx,cy,0,cx,cy,ch*1.15); g.addColorStop(0,rgba([230,120,30],ga)); g.addColorStop(0.5,rgba([160,70,20],ga*0.4)); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // cover transform
  const pop = t>=T.hit ? Math.sin(Math.PI*ph(t,T.hit,T.hit+160))*0.035 : 0;
  const sc=(0.92+0.08*rise)*(1+pop)*(1+0.55*zoom); const dy=(1-rise)*ch*0.08;
  ctx.save(); ctx.translate(cx,cy+dy); ctx.scale(sc,sc);
  ctx.globalAlpha=rise*(1-zoom);
  ctx.shadowColor='rgba(0,0,0,0.7)'; ctx.shadowBlur=40; ctx.shadowOffsetY=12; rr(ctx,-cw/2,-ch/2,cw,ch,cr); ctx.fillStyle='#000'; ctx.fill(); ctx.shadowColor='transparent';
  ctx.save(); rr(ctx,-cw/2,-ch/2,cw,ch,cr); ctx.clip(); ctx.drawImage(cover,-cw/2,-ch/2,cw,ch);
  // light sweep
  const sw=ph(t,T.hit,T.sweepTo); if(sw>0&&sw<1){const bx=-cw+ (2*cw)*eInOut3(sw); const lg=ctx.createLinearGradient(bx-cw*0.22,-ch/2,bx+cw*0.22,ch/2); lg.addColorStop(0,'rgba(255,255,255,0)');lg.addColorStop(0.5,'rgba(255,248,230,0.32)');lg.addColorStop(1,'rgba(255,255,255,0)'); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=lg; ctx.fillRect(-cw/2,-ch/2,cw,ch); ctx.globalCompositeOperation='source-over';}
  ctx.restore();
  // rim + sparks
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round'; ctx.lineJoin='round';
  const pad=4; const hw=cw/2+pad, hh=ch/2+pad, r=cr+pad;
  const p=charge;
  for(const dir of [-1,1]){ const N=80; const pts=[]; for(let i=0;i<=N;i++) pts.push(rrPoint(hw,hh,r,p*i/N,dir));
    for(const [w,a] of [[14,0.06],[6,0.2],[2.2,1]]){ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1])); ctx.strokeStyle=rgba([255,190,80],Math.min(1,a*(1+1.5*hitK))*rise*(1-zoom)); ctx.lineWidth=w; ctx.stroke();}
    if(p>0&&p<1){const h=rrPoint(hw,hh,r,p,dir); let sg=ctx.createRadialGradient(h[0],h[1],0,h[0],h[1],22); sg.addColorStop(0,'rgba(255,255,255,1)'); sg.addColorStop(0.3,'rgba(255,216,74,0.7)'); sg.addColorStop(1,'rgba(255,160,40,0)'); ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(h[0],h[1],22,0,6.283); ctx.fill();}
  }
  ctx.restore(); ctx.save(); ctx.translate(cx,cy); ctx.globalCompositeOperation='lighter';
  // shock ring
  const u=ph(t,T.hit,T.ringTo); if(t>=T.hit&&u<1){const k=1+0.5*eOut3(u); ctx.strokeStyle=rgba([255,200,110],0.6*(1-u)*(1-u)); ctx.lineWidth=3*(1-u)+0.5; rr(ctx,-hw*k,-hh*k,2*hw*k,2*hh*k,r*k); ctx.stroke();}
  ctx.restore(); ctx.globalCompositeOperation='source-over';
  // title + console
  const ti=eOut3(ph(t,T.titleIn,T.titleInEnd))*(1-ph(t,T.titleOut,T.titleOutEnd));
  if(ti>0){ctx.textAlign='center'; ctx.globalAlpha=ti; ctx.fillStyle='#fff'; ctx.font=`700 ${H*0.042}px Roboto, Arial`; ctx.fillText('Super Game Adventure', cx, cy+ch/2+H*0.085+(1-ti)*8);
    ctx.fillStyle='rgba(245,154,44,0.9)'; ctx.font=`600 ${H*0.024}px Roboto, Arial`; ctx.fillText('S U P E R   N I N T E N D O', cx, cy+ch/2+H*0.13+(1-ti)*8); ctx.globalAlpha=1;}
  // flash at the hit
  if(t>=T.hit){const f=Math.pow(1-ph(t,T.hit,T.hit+200),2); ctx.globalCompositeOperation='lighter'; ctx.fillStyle=`rgba(255,200,120,${0.08*f})`; ctx.fillRect(0,0,W,H); ctx.globalCompositeOperation='source-over';}
  // final fade to black
  ctx.fillStyle=`rgba(0,0,0,${ph(t,T.zoomFrom+120,T.total)})`; ctx.fillRect(0,0,W,H);
}
window.render=(t)=>{const c=document.getElementById('c');draw(c.getContext('2d'),t,c.width,c.height);return c.toDataURL('image/png');};
</script></body></html>
