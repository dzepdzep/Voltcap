name: Verify Android update 310

on:
  push:
    branches:
      - fix/dual-screen-controls-310
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile and unit-test (not a signed release)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify required local Discord SDK is available
        run: |
          AAR="app/libs/discord/lib/release/discord_partner_sdk.aar"
          if [ ! -s "$AAR" ]; then
            echo "::error file=app/build.gradle.kts::Cannot compile: Discord Social SDK AAR is absent. Use the exact licensed SDK on the developer PC, or configure a secure CI source. Do not substitute a different release key."
            exit 1
          fi
      # GitHub's ubuntu-latest image already provides Android SDK command-line tools.
      # setup-android@v3 currently requests the removed "tools" SDK package and fails.
      - name: Install Android 36 and native tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKM=$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKM"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Build and run JVM unit tests
        run: bash ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-310-test-results
          path: |
            app/build/reports/tests
            app/build/test-results
          if-no-files-found: ignore
      - name: Save non-release debug APK for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: update-310-debug-only-not-for-release
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
