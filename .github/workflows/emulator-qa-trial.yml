name: Emulator QA trial (isolated QA app)

# 529m - hosted Android-emulator test of the isolated QA app (com.shelf.launcher.qa), owner request in #16.
# 674o (cloud migration, owner 15 Nov 2026): first make this trial pass reliably, then widen it.
#  - The emulator itself crashed ~90 s into every trial since 14 Nov (host renderer "Failed to find ColorBuffer", then the
#    qemu process gone) while it ran the ARM build through its ARM translation on a 320x640 AVD forced to 960x640. Now:
#    an x86_64 QA build (-PvoltcapEmulatorAbi=true, Discord stub only), the AVD made at the profile's own size (-skin), and
#    a small matrix of renderer modes so one run shows which mode stays up. The build runs once and every emulator job
#    installs that same APK.
#  - Verdict: each emulator job ends with a step that FAILS unless every graded check is PASS. NOT TESTED, INFRA and
#    FAIL are reported as such and turn the job red; nothing is skipped to make it green.
# It runs ONLY when asked:
#  - workflow_dispatch (optionally choosing the matrix), or
#  - a push to claude/qa-0672-repair whose head commit message contains "[emulator-qa]".
# Ordinary development pushes never start it. No secrets are used or exposed; contents: read; checkout keeps no credentials.
# Synthetic QA fixtures only (the app's own QA hooks); no accounts, ROMs, saves or private recordings; game launches blocked.
# Emulator evidence is labelled EMULATOR and is never real-handheld evidence (GPU / frame pacing, OEM behaviour, physical
# controls, charging and two-screen devices still need real devices).

on:
  workflow_dispatch:
    inputs:
      renderers:
        description: 'Renderer modes to try (comma list of swiftshader_indirect, swangle_indirect, guest)'
        default: 'swangle_indirect'
        required: false
  push:
    branches: [claude/qa-0672-repair]

permissions:
  contents: read

concurrency:
  group: emulator-qa-trial-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the x86_64 QA app (emulator)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      renderers: ${{ steps.matrix.outputs.renderers }}
    steps:
      - name: Checkout exact commit (no stored credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36
        run: |
          SDKM=$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKM"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: true
      - name: Build (debug = com.shelf.launcher.qa, Discord SDK stub, debug key, + x86_64)
        # (529t: lint's own tool download failed once on Maven Central - lint is not part of this test; one retry for a
        # passing network hiccup.)
        timeout-minutes: 20
        run: |
          for i in 1 2; do
            bash ./gradlew --no-daemon -PvoltcapCiWithoutDiscord=true -PvoltcapEmulatorAbi=true :app:assembleDebug -x lintVitalAnalyzeDebug && exit 0
            echo "build attempt $i failed"; sleep 20
          done
          exit 1
      - name: Check the APK is the isolated QA app with x86_64 code
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.shelf.launcher.qa'"
          unzip -l "$APK" | awk '{print $4}' | grep '^lib/' | cut -d/ -f2 | sort -u | tee abis.txt
          if grep -q '^lib/' <(unzip -l "$APK" | awk '{print $4}'); then grep -qx x86_64 abis.txt; fi
          mkdir -p qa-apk && cp "$APK" qa-apk/
      - name: Renderer matrix
        id: matrix
        env:
          # (674o run 43762702001: swangle_indirect stayed up through both popup gates; swiftshader_indirect went offline after
          # the first, guest never reached a clean home. swangle is the default; the others stay selectable by hand.)
          WANT: ${{ github.event.inputs.renderers || 'swangle_indirect' }}
        run: |
          python3 -c "import json,os; r=[x.strip() for x in os.environ['WANT'].split(',') if x.strip() in ('swiftshader_indirect','swangle_indirect','guest')]; print('renderers=' + json.dumps(r or ['swiftshader_indirect']))" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-apk-${{ github.sha }}
          path: qa-apk
          retention-days: 3

  emulator:
    name: Emulator trial (KONKR-like 960x640 / 240 dpi, ${{ matrix.gpu }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        gpu: ${{ fromJSON(needs.build.outputs.renderers) }}
    env:
      PYTHONIOENCODING: utf-8
      QA_PROFILE: konkr
      QA_SKIN: 960x640
      QA_DENSITY: '240'
      QA_GPU: ${{ matrix.gpu }}
    steps:
      - name: Checkout exact commit (no stored credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qa-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug
      - name: Python tools for grading
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy pillow opencv-python-headless
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run the trial
        # (bounded inside the job, so the evidence upload and the verdict below always run)
        timeout-minutes: 38
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -skin 960x640 -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: bash tools/qa/emulator/run_trial.sh qa-emulator-out
      - name: Keep the emulator's own crash data
        if: always()
        run: |
          mkdir -p qa-emulator-out/emulator-crash
          for d in /tmp/android-runner /tmp/android-$USER ~/.android; do find "$d" -maxdepth 2 -iname '*crash*' 2>/dev/null; done | head -20 > qa-emulator-out/emulator-crash/where.txt || true
          while read -r p; do [ -e "$p" ] && cp -r "$p" qa-emulator-out/emulator-crash/ 2>/dev/null || true; done < qa-emulator-out/emulator-crash/where.txt
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-qa-${{ matrix.gpu }}-${{ github.sha }}
          path: qa-emulator-out
          retention-days: 7
          if-no-files-found: warn
      - name: Verdict (PASS only when every graded check is PASS)
        if: always()
        run: |
          test -f qa-emulator-out/verdict.txt || { echo "::error::no verdict written - the trial did not reach grading (NOT TESTED)"; exit 1; }
          cat qa-emulator-out/verdict.txt
          cat qa-emulator-out/verdict.txt >> "$GITHUB_STEP_SUMMARY"
          head -1 qa-emulator-out/verdict.txt | grep -qx 'VERDICT: PASS' || { echo "::error::emulator trial is not PASS (see verdict.txt and summary.md)"; exit 1; }
