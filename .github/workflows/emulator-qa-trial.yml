name: Emulator QA trial (draft, isolated QA app)

# 529m - first hosted Android-emulator smoke test of the isolated QA app (com.shelf.launcher.qa), owner request in #16.
# Draft for review. It runs ONLY when asked:
#  - workflow_dispatch (works once this file is on the default branch), or
#  - a push to claude/qa-0672-repair that changes this trial's own files AND whose head commit message contains
#    "[emulator-qa]" (workflow_dispatch cannot start a workflow that exists only on a development branch).
# Ordinary development pushes never start it. No secrets are used or exposed; contents: read; checkout keeps no credentials.
# Synthetic QA fixtures only (the app's own QA hooks); no accounts, ROMs, saves or private recordings.
# Emulator evidence is labelled EMULATOR and is never real-handheld evidence (GPU / frame pacing, OEM behaviour, physical
# controls and two-screen devices still need real devices).

on:
  workflow_dispatch:
  push:
    branches: [claude/qa-0672-repair]
    paths:
      - .github/workflows/emulator-qa-trial.yml
      - tools/qa/emulator/**

permissions:
  contents: read

concurrency:
  group: emulator-qa-trial
  cancel-in-progress: false

jobs:
  emulator:
    name: Emulator smoke test (x86_64, 960x640 profile)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emulator-qa]')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout exact commit (no stored credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Configure JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 36 and native tools
        run: |
          SDKM=$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKM"
          "$SDKM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@ac638b010cf58a27ee6c972d7336334ccaf61c96 # v4.4.1
        with:
          cache-read-only: true
      - name: Build the isolated QA app (debug = com.shelf.launcher.qa, Discord SDK stub, debug key)
        run: bash ./gradlew --no-daemon -PvoltcapCiWithoutDiscord=true :app:assembleDebug
      - name: Python tools for grading
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy pillow opencv-python-headless
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot emulator and run the trial
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: false
          script: bash tools/qa/emulator/run_trial.sh qa-emulator-out
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: emulator-qa-trial-${{ github.sha }}
          path: qa-emulator-out
          retention-days: 7
          if-no-files-found: warn
